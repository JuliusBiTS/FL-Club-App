name: flc_core
description: >
  Shared design tokens, models, ticket/membership crypto and repository
  contracts used by both the Frontline Club app and the admin console.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  crypto: ^3.0.3
  meta: ^1.15.0

  # Shared event-management UI (used by both the admin console and the
  # mobile app's staff editor) — one editor, two surfaces.
  supabase_flutter: ^2.8.0
  file_picker: ^8.1.4
  flutter_widget_from_html_core: ^0.15.2
  # A range, not a pin: the admin console resolves 0.19.x, the app is held to
  # 0.20.x by flutter_localizations. DateFormat behaves the same in both.
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  test: ^1.25.8

flutter:
  # No assets of its own — fonts/icons live in app/ and admin/, which both
  # depend on this package for tokens, not the other way round.
