name: frontline_club_app
description: Frontline Club — events, tickets, membership card, podcast and news.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

# NOTE: this pubspec was hand-written before `flutter create` had been run
# in this environment (see README "Getting started"). Once Flutter is
# installed, running `flutter create --org com.frontlineclub --project-name
# frontline_club_app --platforms android,ios .` from this directory will
# generate the missing android/, ios/ platform folders WITHOUT touching
# this file or lib/ — do that before the first `flutter run`.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flc_core:
    path: ../packages/flc_core

  # State & navigation (briefing §7.1). Providers are written by hand
  # (Provider/StreamProvider/FutureProvider/AsyncNotifier) rather than via
  # riverpod_generator's @riverpod codegen — its `build` package pin
  # currently conflicts with build_runner 2.16+, and nothing here needs
  # the extra codegen convenience yet. Revisit if that changes.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Backend
  supabase_flutter: ^2.8.0

  # Payments
  flutter_stripe: ^14.0.0

  # Local cache / secure storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.2

  # Push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Audio (podcast player)
  just_audio: ^0.9.42
  audio_service: ^0.18.15

  # Scanning / codes
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # Content rendering
  flutter_widget_from_html_core: ^0.15.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.3 # pinned by flutter_localizations' own constraint
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.1.1

  # Monitoring
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: ^2.21.1
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.3

# Generates android/app/src/main/res/mipmap-*/ic_launcher.png +
# adaptive-icon layers from the demo logo pulled from frontlineclub.com
# (see assets/images/brand/ — flat JPG, no transparency, fine for a demo,
# not for a store submission). Re-run `dart run flutter_launcher_icons`
# after swapping in a real vector mark. docs/OPEN_QUESTIONS.md.
flutter_launcher_icons:
  android: true
  image_path: "assets/images/brand/app_icon_source.png"
  adaptive_icon_background: "#33460C"
  adaptive_icon_foreground: "assets/images/brand/app_icon_source.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true # flutter_localizations / ARB codegen, briefing §6 Language

  assets:
    - assets/images/brand/

  # TODO: real font files still needed — see
  # packages/flc_core/lib/src/theme/flc_typography.dart (font licensing),
  # docs/OPEN_QUESTIONS.md.
  # fonts:
  #   - family: Source Serif 4
  #     fonts:
  #       - asset: assets/fonts/SourceSerif4-Regular.ttf
  #       - asset: assets/fonts/SourceSerif4-SemiBold.ttf
  #         weight: 600
  #   - family: Inter
  #     fonts:
