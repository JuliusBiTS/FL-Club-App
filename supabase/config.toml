project_id = "frontline-club-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Real values come from the linked project once created — see README "Getting started".
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://www.frontlineclub.com"]
jwt_expiry = 3600            # 1 hour access token, briefing §13.7
enable_signup = true
enable_confirmations = false # dev only — enable email confirmation before any real deploy

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true

[analytics]
enabled = false
