project_id = "frontline-club-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Real values come from the linked project once created — see README "Getting started".
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://www.frontlineclub.com"]
jwt_expiry = 3600            # 1 hour access token, briefing §13.7
enable_signup = true
enable_confirmations = false # dev only — enable email confirmation before any real deploy

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true

[analytics]
enabled = false

# Per-function JWT verification, declared explicitly rather than relying on
# `--no-verify-jwt` at deploy time — that flag's effect turned out to be
# sticky server-side across redeploys that omit it, so the only reliable
# way to keep this correct is to state it here and let every deploy
# reconcile against it. User-facing functions (called with the caller's own
# session) verify a real JWT; functions Stripe or pg_cron call directly
# don't carry one at all, so they can't.
[functions.create-order]
verify_jwt = true
[functions.refund-order]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
[functions.get-member-card]
verify_jwt = true
[functions.get-scan-pack]
verify_jwt = true
[functions.verify-scan]
verify_jwt = true
[functions.membership-apply]
verify_jwt = false # briefing §4/§9.7: guests (no account) can also register interest
[functions.stripe-webhook]
verify_jwt = false # Stripe calls this with its own signature, not a Supabase JWT — see §13.1 T8
[functions.expire-pending-orders]
verify_jwt = false # pg_cron-triggered
[functions.eventbrite-sync]
verify_jwt = false # pg_cron-triggered
[functions.podcast-sync]
verify_jwt = false # pg_cron-triggered
[functions.wordpress-sync]
verify_jwt = false # pg_cron-triggered
[functions.purge-deleted-accounts]
verify_jwt = false # pg_cron-triggered
